health_addr = "0.0.0.0:8080"
checkpoint_path = "/var/lib/aqueduct/checkpoint"
inspector = true   # token comes from AQUEDUCT_ADMIN_TOKEN

# Second pipeline: reads the CDC topics written by the Postgres pipeline through the Kafka source
# and republishes them as mirror.* topics. Exercises the Kafka source with live traffic.
[source]
type = "kafka"
brokers = ["kafka:9092"]
topics = ["cdc.public.*"]
start_at = "earliest"

[sink]
brokers = ["kafka:9092"]
topic = "mirror.{schema}.{table}"
partitions = 1
