[package]
name = "aqueduct-source-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aqueduct-core = { path = "../aqueduct-core" }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "fs", "macros"] }
tokio-postgres = "0.7"
tracing.workspace = true
aqueduct-tls = { path = "../aqueduct-tls" }
tokio-postgres-rustls = "0.13"
bytes = "1"
# The token client: HTTP/1.1 only, on the tokio runtime.
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
postgres-protocol = "0.6"
ring = { version = "0.17", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
x509-cert = { version = "0.2", default-features = false }

[lints]
workspace = true
