[package]
name = "aqueduct"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aqueduct-core = { path = "../aqueduct-core" }
aqueduct-sinks = { path = "../aqueduct-sinks" }
aqueduct-source-postgres = { path = "../aqueduct-source-postgres" }
aqueduct-source-mongodb = { path = "../aqueduct-source-mongodb" }
aqueduct-tls = { path = "../aqueduct-tls" }
# OTLP export (opt-in). No default features: http/protobuf only, over our own small HTTP client
# (rustls/ring from aqueduct-tls), so neither hyper, reqwest nor tonic come in.
opentelemetry = { version = "0.33", default-features = false, features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "logs", "http-proto"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-appender-tracing = { version = "0.33", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
bytes = "1"
http = "1"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true

# glibc malloc spends ~38% of the hot path in _int_free/_int_malloc/malloc_consolidate under
# cross-thread frees; jemalloc's per-thread caches avoid that. Not built for MSVC targets.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
# The in-memory metric exporter the OTLP mapping test reads back.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "logs", "testing"] }
