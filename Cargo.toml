[workspace]
resolver = "2"
members = ["crates/aqueduct-tls", "crates/aqueduct-core", "crates/aqueduct", "crates/aqueduct-source-postgres", "crates/aqueduct-sinks", "crates/aqueduct-source-kafka", "crates/aqueduct-source-mongodb", "crates/aqueduct-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "io-std", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
