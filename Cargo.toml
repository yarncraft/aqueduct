[workspace]
resolver = "2"
members = ["crates/aqueduct-tls", "crates/aqueduct-core", "crates/aqueduct", "crates/aqueduct-source-postgres", "crates/aqueduct-sinks", "crates/aqueduct-source-mongodb", "crates/aqueduct-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# The toolchain `rust-toolchain.toml` pins, which is the only one CI builds with. Bump both together.
rust-version = "1.99"

# Every crate opts in with `[lints] workspace = true`. `clippy.toml` lets tests unwrap.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
# No features here: each crate asks for the parts of tokio it uses.
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
