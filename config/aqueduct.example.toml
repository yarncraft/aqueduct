health_addr = "0.0.0.0:8080"
checkpoint_path = "/var/lib/aqueduct/checkpoint"
# admin_token = "<random, 16+ chars>"   # `openssl rand -hex 32`. REQUIRED while health_addr is non-loopback (startup refuses otherwise)
# admin_insecure_no_auth = false  # explicit, loudly-logged opt-out of the above; do not use in production
# inspector = true            # event inspector reads recent events back from Kafka; needs admin_token

[postgres]
url = "postgres://aqueduct:aqueduct@postgres:5432/app"
slot = "aqueduct"
publication = "aqueduct"
# TLS defaults to verify-full (cert chain + hostname). Point ssl_root_cert at your CA if it is private.
# ssl_root_cert = "/etc/aqueduct/pg-ca.pem"
# Only for a trusted private network without TLS (compose demo): ssl_mode = "disable"

# Kafka is the only sink.
[sink]
brokers = ["kafka:9092"]
topic = "cdc.{schema}.{table}"   # fallback: one topic per table
partitions = 1

# First match wins; add routes to send tables elsewhere.
# [[sink.routes]]
# match = "public.users"
# topic = "users-events"
